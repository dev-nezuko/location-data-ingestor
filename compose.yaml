# Local stack: Redis broker, a Celery worker and the Django admin, sharing one
# SQLite file on the poi-data volume. Copy .env.example to .env first.
x-app: &app
  build: .
  image: location-data-ingestor:local
  env_file: .env
  environment:
    CELERY_BROKER_URL: redis://redis:6379/0
    SQLITE_PATH: /data/db.sqlite3
  volumes:
    - poi-data:/data

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["celery", "-A", "SearchSmartly", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  poi-data:
